<!DOCTYPE html>
<html>
<head>
  <title>Shipito Tracking</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dbeafe, #fce7f3);
    }

    /* HEADER (Company Name) */
    .header {
      background: #2563eb;
      color: white;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    h1 {
      margin-top: 30px;
      font-size: 24px;
      color: #222;
    }

    .container {
      margin-top: 40px;
    }

    input {
      padding: 12px;
      width: 220px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin-left: 10px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
    }

    /* Loading */
    #loadingBox {
      display: none;
      margin-top: 30px;
    }

    .spinner {
      margin: auto;
      width: 50px;
      height: 50px;
      border: 6px solid #ddd;
      border-top: 6px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Result Card */
    #resultBox {
      display: none;
      margin: 30px auto;
      padding: 20px;
      width: 90%;
      max-width: 380px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      text-align: left;
    }

    .status {
      font-weight: bold;
      color: #16a34a;
    }

    /* Route */
    .route {
      font-size: 14px;
      margin: 10px 0;
      color: #444;
    }

    /* Progress bar */
    .progress {
      margin: 15px 0;
      height: 10px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 2s;
    }

    /* Timeline */
    .timeline {
      margin-top: 15px;
      font-size: 14px;
    }

    .step {
      margin: 8px 0;
      padding-left: 10px;
      border-left: 3px solid #ccc;
    }

    .active {
      border-left: 3px solid #2563eb;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="header">SHIPITO</div>

<h1>Track Your Shipment</h1>

<div class="container">
  <input type="text" id="code" placeholder="Enter tracking number">
  <button onclick="search()">Track</button>

  <div id="loadingBox">
    <div class="spinner"></div>
    <p>Fetching shipment details...</p>
  </div>

  <div id="resultBox">
    <h3>Shipment Details</h3>
    <p><b>Tracking ID:</b> <span id="trackId"></span></p>
    <p><b>Status:</b> <span class="status" id="statusText"></span></p>

    <div class="route">
      📍 <b>From:</b> Torrance, California, USA <br>
      📦 <b>To:</b> Mohali, Punjab, India
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="timeline" id="timeline"></div>
  </div>

</div>

<script>
function search() {
  var input = document.getElementById("code").value;
  var loading = document.getElementById("loadingBox");
  var result = document.getElementById("resultBox");

  loading.style.display = "block";
  result.style.display = "none";

  setTimeout(function() {
    loading.style.display = "none";

    if(input === "58669397071") {
      showTracking("58669397071", "Pickup Scheduled", 10, [
        "Pickup Scheduled From - Torrance Facility",
        "Dispatched from USA Warehouse",
        "In Transit to India (Current)",
        "Arrived in India Hub",
        "Out for Delivery",
        "Delivered"
      ]);
    } 
    else if(input === "11111") {
      showTracking("11111", "Delivered", 100, [
        "Order Received",
        "Shipped",
        "In Transit",
        "Reached India",
        "Out for Delivery",
        "Delivered Successfully"
      ]);
    } 
    else {
      alert("Invalid Tracking Number");
    }

  }, 4000);
}

function showTracking(id, status, progress, steps) {
  document.getElementById("trackId").innerText = id;
  document.getElementById("statusText").innerText = status;

  document.getElementById("resultBox").style.display = "block";

  setTimeout(() => {
    document.getElementById("progressBar").style.width = progress + "%";
  }, 100);

  var timelineHTML = "";
  steps.forEach(step => {
    if(step.includes("Current") || step.includes("Delivered")) {
      timelineHTML += `<div class="step active">${step}</div>`;
    } else {
      timelineHTML += `<div class="step">${step}</div>`;
    }
  });

  document.getElementById("timeline").innerHTML = timelineHTML;
}
</script>

</body>
</html>
